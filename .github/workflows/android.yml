name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gradle wrapper
        run: chmod +x ./gradlew

      - name: Сборка debug + release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Ошибки сборки — в аннотацию (логи читаемы через API)
        if: failure()
        run: python3 .github/scripts/annotate_build.py

      - name: Юнит-тесты
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Причина падения тестов
        if: failure()
        run: python3 .github/scripts/annotate_tests.py

      - name: Имя артефакта
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "name=BluetoothYaBike-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Загрузка APK в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      # Постоянная ссылка: https://github.com/AlfaGideon/BluetoothYaBike/releases/latest/download/app-release.apk
      # Тег latest перезаписывается каждым успешным пушем, поэтому ссылка всегда на свежий APK.
      - name: Перезаписать релиз latest
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            APK, собранный из ${{ github.ref_name }} @ ${{ github.sha }}.
            Скачать: `app-release.apk` (release-подпись debug-ключом) или `app-debug.apk`.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true

  # Ручной запуск из ветки: свежий APK всегда доступен как "последний успешный артефакт".
  # Скачать: Actions -> нужный run -> Artifacts -> BluetoothYaBike-<sha>.zip
